<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1430">
<title>Overstack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#231942; --page:#fff3dc; --panel:#fffaf0; --panel2:#ffe9c2; --text:#231942; --muted:#6b5c86;
  --pink:#ff4f8b; --sun:#ffc83d; --mint:#3be0b4; --sky:#57b6ff; --scrim:rgba(35,25,66,0.72);
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --page:#1a1230; --panel:#2b2050; --panel2:#3a2c66; --text:#fdf6ff; --muted:#b6a8d8; --scrim:rgba(10,6,24,0.8); color-scheme:dark; }
}
:root[data-theme="dark"]{ --page:#1a1230; --panel:#2b2050; --panel2:#3a2c66; --text:#fdf6ff; --muted:#b6a8d8; --scrim:rgba(10,6,24,0.8); color-scheme:dark; }
*,*::before,*::after{ box-sizing:inherit; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{ height:100%; margin:0; background:var(--page); color:var(--text); font:600 15px/1.4 var(--body); overflow:hidden;
  overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
#app{ position:relative; width:100%; height:100%; overflow:hidden; background:#1b1430; }
#cv{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
#ui{ position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; background:var(--scrim); z-index:5; }
#ui[hidden]{ display:none; }
#ui[data-mode="menu"]{ background:var(--page); }
#ui[data-mode="pause"]{ background:rgba(22,15,42,0.94); }
#toasts{ position:absolute; left:50%; top:auto; bottom:21%; transform:translateX(-50%); width:min(92%,380px); display:flex; flex-direction:column; gap:6px; z-index:6; pointer-events:none; }
#ui:not([hidden]) + #toasts{ top:10px; bottom:auto; }
.toast{ background:var(--panel); color:var(--text); border:3px solid var(--ink); border-radius:14px; box-shadow:0 4px 0 var(--ink); padding:8px 12px; display:flex; flex-direction:column; animation:tin .25s ease-out; transition:opacity .4s, transform .4s; }
.toast b{ font:400 17px var(--display); } .toast span{ font-size:13px; color:var(--muted); }
.toast.quest{ border-color:var(--ink); background:var(--sun); color:var(--ink); } .toast.quest span{ color:#4a3b17; }
.toast.out{ opacity:0; transform:translateY(-8px); }
@keyframes tin{ from{ transform:translateY(-10px); opacity:0; } }

.screen,.modal{ width:min(100%,520px); margin:0 auto; padding:22px 16px 28px; display:flex; flex-direction:column; gap:12px; }
.modal{ min-height:100%; justify-content:center; }
h2,h3,.mtitle,.endtitle{ font-family:var(--display); font-weight:400; margin:0; letter-spacing:0.01em; }
h2{ font-size:24px; } h3{ font-size:18px; margin-top:6px; }
.mtitle{ font-size:clamp(34px,10vw,46px); text-align:center; color:#fff; -webkit-text-stroke:2px var(--ink); paint-order:stroke fill; text-shadow:0 4px 0 var(--ink); }
.msub{ text-align:center; margin:-6px 0 4px; color:#fff; font-weight:800; text-shadow:0 2px 0 var(--ink); }
.screen .msub{ color:var(--muted); text-shadow:none; }
.note{ color:var(--muted); font-size:13px; margin:0; }
.modal .note, .modal h3{ color:#fff; text-shadow:0 2px 0 var(--ink); }

.btn{ font:400 18px var(--display); color:var(--text); background:var(--panel); border:3px solid var(--ink); border-radius:16px; padding:12px 16px; box-shadow:0 5px 0 var(--ink); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; touch-action:manipulation; transition:transform .06s, box-shadow .06s; }
.btn:active:not(:disabled){ transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
.btn:focus-visible,.chip:focus-visible,.card:focus-visible,.ccard:focus-visible{ outline:3px solid var(--sky); outline-offset:3px; }
.btn:disabled{ opacity:0.5; cursor:default; }
.btn.big{ font-size:24px; padding:14px 18px; }
.btn.sm{ font-size:15px; padding:7px 12px; border-radius:12px; box-shadow:0 3px 0 var(--ink); }
.btn.pink{ background:var(--pink); color:#fff; }
.btn.ghost{ background:transparent; box-shadow:none; color:var(--text); border-color:var(--muted); }
.btn.danger{ background:#ff5b5b; color:#fff; }
.chip{ font:800 13px var(--body); color:var(--text); background:var(--panel2); border:2px solid var(--ink); border-radius:999px; padding:7px 12px; cursor:pointer; touch-action:manipulation; }
.chip.on{ background:var(--mint); color:var(--ink); }
.chip:disabled{ opacity:0.45; cursor:default; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; } .row3{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.pill{ background:var(--ink); color:#fff; border-radius:999px; padding:1px 8px; font:800 12px var(--body); }
.silver{ font:800 14px var(--body); white-space:nowrap; }
.bar{ display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px; } .bar h2{ text-align:center; }

.title-screen{ min-height:100%; justify-content:center; text-align:center; }
.logo{ display:flex; flex-direction:column; align-items:center; line-height:0.86; margin:6px 0 2px; font-family:var(--display); font-size:clamp(64px,22vw,112px); color:var(--sun); -webkit-text-stroke:4px var(--ink); paint-order:stroke fill; text-shadow:0 7px 0 var(--ink); }
.logo span:first-child{ color:var(--pink); transform:rotate(-4deg) translateX(-6%); }
.logo span:last-child{ transform:rotate(2deg) translateX(5%); }
.tagline{ margin:6px 0 10px; font-weight:800; color:var(--muted); }
.howto{ text-align:left; background:var(--panel); border:3px solid var(--ink); border-radius:16px; padding:10px 14px; }
.howto summary{ font:400 18px var(--display); cursor:pointer; } .howto p{ margin:8px 0; font-size:14px; }
.foot{ color:var(--muted); font-size:12px; margin:0; }

.cgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.ccard{ text-align:left; display:flex; flex-direction:column; gap:4px; padding:12px; background:var(--panel); color:var(--text); border:3px solid var(--ink); border-radius:16px; box-shadow:0 4px 0 var(--ink); cursor:pointer; font-family:var(--body); touch-action:manipulation; }
.ccard.sel{ background:var(--panel2); box-shadow:0 4px 0 var(--ink), inset 0 0 0 3px var(--cc); }
.ccard.locked{ opacity:0.6; cursor:default; }
.cface{ width:40px; height:40px; border-radius:50%; background:var(--cc); border:3px solid var(--ink); position:relative; }
.cface::after{ content:""; position:absolute; right:7px; top:12px; width:6px; height:6px; border-radius:50%; background:var(--ink); box-shadow:-11px 0 0 var(--ink); }
.ccard.locked .cface{ filter:grayscale(1); }
.cname{ font:400 20px var(--display); } .cw{ font-weight:800; font-size:13px; } .cp{ font-size:12px; color:var(--muted); }

.slist{ display:flex; flex-direction:column; gap:8px; }
.srow,.qrow,.mrow,.brow{ display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--panel); color:var(--text); border:3px solid var(--ink); border-radius:14px; }
.mrow{ box-shadow:inset 6px 0 0 var(--rc); }
.sicon{ font-size:26px; width:36px; text-align:center; flex:none; }
.sinfo{ flex:1; display:flex; flex-direction:column; gap:2px; min-width:0; } .sinfo .rb{ align-self:flex-start; } .sinfo b{ font:400 17px var(--display); } .sinfo span{ font-size:12.5px; color:var(--muted); } .sinfo em{ font-style:normal; color:var(--pink); }
.pips{ display:flex; gap:3px; margin-top:2px; } .pips i{ width:12px; height:6px; border-radius:3px; background:var(--panel2); border:1.5px solid var(--muted); } .pips i.on{ background:var(--pink); }
.maxed{ font:400 15px var(--display); color:var(--mint); -webkit-text-stroke:1px var(--ink); paint-order:stroke fill; }
.qck{ width:26px; height:26px; flex:none; border-radius:8px; border:3px solid var(--ink); display:grid; place-items:center; font-weight:900; background:var(--panel2); }
.qrow.done .qck{ background:var(--mint); } .qrow.done{ opacity:0.85; }
.qrew{ color:var(--pink) !important; font-weight:800; }
.qbar{ display:block; height:7px; border-radius:4px; background:var(--panel2); border:1.5px solid var(--muted); overflow:hidden; margin-top:3px; } .qbar i{ display:block; height:100%; background:var(--sky); }

/* rarity foil cards: the one loud element */
.cards{ display:flex; flex-direction:column; gap:10px; }
.card{ position:relative; display:flex; gap:12px; align-items:center; text-align:left; padding:12px 14px; background:var(--panel); color:var(--text); border:3px solid var(--ink); border-radius:18px; box-shadow:0 6px 0 var(--ink), inset 0 0 0 3px var(--rc); cursor:pointer; font-family:var(--body); overflow:hidden; touch-action:manipulation; animation:deal .28s cubic-bezier(.2,1.4,.4,1) backwards; }
.card:nth-child(2){ animation-delay:.05s; } .card:nth-child(3){ animation-delay:.1s; }
@keyframes deal{ from{ transform:translateY(24px) scale(.94); opacity:0; } }
.card:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--ink), inset 0 0 0 3px var(--rc); }
.card.r2,.card.r3,.card.r4{ background:linear-gradient(115deg, var(--panel) 30%, color-mix(in srgb, var(--rc) 22%, var(--panel)) 48%, var(--panel) 66%); background-size:300% 100%; animation:deal .28s cubic-bezier(.2,1.4,.4,1) backwards, foil 2.6s linear infinite; }
.card.r4{ box-shadow:0 6px 0 var(--ink), inset 0 0 0 4px var(--rc), 0 0 22px color-mix(in srgb, var(--rc) 70%, transparent); }
@keyframes foil{ from{ background-position:100% 0; } to{ background-position:-200% 0; } }
.cicon{ font-size:30px; width:54px; height:54px; flex:none; display:grid; place-items:center; border-radius:14px; border:3px solid var(--ink); background:color-mix(in srgb, var(--rc) 35%, var(--panel)); }
.cbody{ display:flex; flex-direction:column; gap:2px; min-width:0; flex:1; }
.ctop{ display:flex; justify-content:space-between; align-items:center; gap:8px; } .ctop b{ font:400 19px var(--display); }
.clvl{ font-size:12px; font-weight:800; color:var(--muted); }
.cline{ font-weight:900; font-size:15px; color:var(--text); } .cdesc{ font-size:13px; color:var(--muted); }
.rb{ font:800 11px var(--body); padding:2px 8px; border-radius:999px; border:2px solid var(--ink); background:var(--rc); color:var(--ink); white-space:nowrap; }
.rb.new{ background:var(--mint); }
.banishing .card{ box-shadow:0 6px 0 var(--ink), inset 0 0 0 3px #ff5b5b; }
.hint{ text-align:center; color:#fff; font-weight:800; margin:0; text-shadow:0 2px 0 var(--ink); }

.reveal{ display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; padding:22px 16px; background:var(--panel); border:3px solid var(--ink); border-radius:22px; box-shadow:0 7px 0 var(--ink), inset 0 0 0 4px var(--rc), 0 0 40px color-mix(in srgb, var(--rc) 60%, transparent); animation:flip .5s cubic-bezier(.2,1.5,.4,1); }
@keyframes flip{ from{ transform:rotateY(90deg) scale(.8); } }
.ricon{ font-size:56px; } .rname{ font:400 26px var(--display); } .stack{ font-weight:900; color:var(--pink); }
.igrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:6px; }
.ichip{ position:relative; display:flex; flex-direction:column; align-items:center; padding:6px 4px; background:var(--panel); border:3px solid var(--ink); border-radius:12px; box-shadow:inset 0 -4px 0 var(--rc); }
.ichip span{ font-size:24px; } .ichip b{ position:absolute; top:-6px; right:-6px; background:var(--ink); color:#fff; border-radius:999px; font-size:11px; padding:0 6px; }
.ichip small{ font-size:9.5px; text-align:center; line-height:1.1; color:var(--muted); }
.stgrid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.strow{ display:flex; justify-content:space-between; gap:6px; padding:7px 10px; background:var(--panel); color:var(--text); border:2px solid var(--ink); border-radius:10px; font-size:13px; } .strow b{ font-weight:900; }
.tabs{ display:flex; gap:8px; justify-content:center; }
.end{ min-height:100%; justify-content:center; }
.endtitle{ font-size:clamp(44px,13vw,64px); text-align:center; color:#ff5b5b; -webkit-text-stroke:3px var(--ink); paint-order:stroke fill; text-shadow:0 5px 0 var(--ink); }
.end.won .endtitle{ color:var(--sun); }
.earned{ text-align:center; font:400 30px var(--display); color:var(--ink); background:var(--sun); border:3px solid var(--ink); border-radius:16px; box-shadow:0 5px 0 var(--ink); padding:10px; display:flex; flex-direction:column; }
.earned small{ font:800 13px var(--body); }
@media (min-width:700px){ .modal{ width:min(100%,700px); } .modal .slist,.modal .stgrid,.modal .reveal,.modal > .btn{ width:min(100%,520px); align-self:center; } .cards{ display:grid; grid-template-columns:repeat(3,1fr); } .card{ flex-direction:column; text-align:center; align-items:center; } .ctop{ flex-direction:column; } }
@media (prefers-reduced-motion:reduce){ .card,.reveal,.toast{ animation:none !important; } }

.pickrow{ font-family:var(--body); text-align:left; width:100%; cursor:pointer; touch-action:manipulation; }
.pickrow:active{ transform:translateY(2px); }
.srow.rar{ box-shadow:inset 6px 0 0 var(--rc); }
.srow.locked{ opacity:0.55; }
.srow.locked .sicon{ filter:grayscale(1); }

.card.mast{ box-shadow:0 6px 0 var(--ink), inset 0 0 0 3px var(--rc), 0 0 0 3px #ffd34d, 0 0 18px rgba(255,211,77,0.7); }
.cmast{ margin-top:4px; padding:5px 8px; border-radius:10px; background:#ffd34d; color:var(--ink); font-weight:900; font-size:13px; line-height:1.25; }
.brow.mastered{ box-shadow:inset 0 0 0 2px #ffd34d; }
.mline{ color:var(--pink) !important; font-weight:900; }
.dmlist{ display:flex; flex-direction:column; gap:6px; padding:10px 12px; background:var(--panel); border:3px solid var(--ink); border-radius:14px; }
.dmrow{ display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 3ch; align-items:center; gap:8px; font-size:13px; color:var(--text); }
.dmname{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:800; } .dmname em{ color:#e0a800; font-style:normal; }
.dmbar{ height:9px; border-radius:5px; background:var(--panel2); border:1.5px solid var(--muted); overflow:hidden; } .dmbar i{ display:block; height:100%; background:var(--pink); }
.dmrow b{ text-align:right; }
.lvtag{ align-self:flex-start; margin-top:2px; font:800 12px var(--body); color:var(--pink) !important; }

/* ---- menus over the animated world ---- */
#ui[data-mode="menu"]{ background:transparent; }
.screen:not(.title-screen){ background:var(--page); border:3px solid var(--ink); border-radius:24px; box-shadow:0 8px 0 rgba(35,25,66,.55); width:min(calc(100% - 20px), 540px); margin:10px auto 24px; }
.title-screen .tagline, .title-screen .foot{ color:#fff; text-shadow:0 2px 0 var(--ink); }
.btn.play{ font-size:30px; padding:16px; }
.tiles{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.tile{ position:relative; display:flex; flex-direction:column; align-items:center; gap:2px; padding:12px 8px; background:var(--panel); color:var(--text); border:3px solid var(--ink); border-radius:18px; box-shadow:0 5px 0 var(--ink); font-family:var(--body); cursor:pointer; touch-action:manipulation; }
.tile:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
.tile:focus-visible, .setrow:focus-visible{ outline:3px solid var(--sky); outline-offset:3px; }
.tile .ti{ font-size:28px; line-height:1.1; } .tile b{ font:400 19px var(--display); } .tile small{ font-size:12px; color:var(--muted); font-weight:800; }
.tile .dot{ position:absolute; top:8px; right:10px; width:13px; height:13px; border-radius:50%; background:var(--pink); border:2px solid var(--ink); animation:pulse 1.2s ease-in-out infinite; }
@keyframes pulse{ 50%{ transform:scale(1.3); } }
.setrow{ display:flex; justify-content:space-between; align-items:center; gap:12px; width:100%; padding:12px 14px; background:var(--panel); color:var(--text); border:3px solid var(--ink); border-radius:14px; font-family:var(--body); text-align:left; cursor:pointer; touch-action:manipulation; }
.setrow b{ display:block; font:400 17px var(--display); } .setrow small{ color:var(--muted); font-size:12.5px; font-weight:700; }
.sw{ flex:none; width:52px; height:30px; border-radius:999px; background:var(--panel2); border:3px solid var(--ink); position:relative; transition:background .15s; }
.sw::after{ content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; border:2px solid var(--ink); transition:left .15s; }
.sw.on{ background:var(--mint); } .sw.on::after{ left:22px; }
.howto-card{ display:flex; flex-direction:column; gap:8px; }
.hstep{ display:flex; gap:12px; align-items:center; padding:10px 12px; background:var(--panel); color:var(--text); border:3px solid var(--ink); border-radius:14px; }
.hstep span{ font-size:26px; flex:none; } .hstep p{ margin:0; font-size:14px; }
.qprog{ font-size:12px; font-weight:900; color:var(--text) !important; }
.cover{ height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; }
.cover .logo{ font-size:min(24vw, 30vh); -webkit-text-stroke-width:clamp(4px, 1vw, 12px); text-shadow:0 1.2vh 0 var(--ink); }
.cover .tagline{ font:400 min(5vw, 6vh) var(--display); color:#fff; -webkit-text-stroke:2px var(--ink); paint-order:stroke fill; text-shadow:0 4px 0 var(--ink); }
@media (prefers-reduced-motion:reduce){ .tile .dot{ animation:none; } }
.kbnav #ui button:focus, .kbnav #ui summary:focus{ outline:4px solid var(--sky); outline-offset:3px; }
.title-screen .quit{ align-self:center; color:#fff; border-color:rgba(255,255,255,.6); }
.setsec{ font:400 18px var(--display); margin:10px 2px 0; color:var(--text); }
.modal .setsec{ color:#fff; text-shadow:0 2px 0 var(--ink); }
.setrow.slid{ flex-wrap:wrap; cursor:default; }
.rng{ display:flex; align-items:center; gap:8px; flex:1 1 150px; justify-content:flex-end; }
.rng input{ flex:1; min-width:110px; max-width:220px; height:28px; accent-color:var(--pink); touch-action:manipulation; }
.rng output{ min-width:4ch; text-align:right; font-weight:900; }
.seg{ display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; }
.reduce-motion #ui *, .reduce-motion #toasts *{ animation:none !important; transition:none !important; }
#ui > .screen, #ui > .modal{ zoom:var(--uiz, 1); }
#ui > .screen:not(.title-screen){ width:min(calc(100% / var(--uiz, 1) - 20px), 540px); }
#ui > .modal{ width:min(calc(100% / var(--uiz, 1)), 700px); }
#ui > .title-screen{ width:min(calc(100% / var(--uiz, 1)), 520px); }
.buildbtn{ align-self:center; }
.buildpanel{ display:flex; flex-direction:column; gap:7px; padding:10px; background:var(--panel); color:var(--text); border:3px solid var(--ink); border-radius:16px; }
.brow2{ display:flex; flex-wrap:wrap; align-items:center; gap:5px; } .brow2 > small{ width:100%; font-weight:900; color:var(--muted); font-size:11px; letter-spacing:.04em; text-transform:uppercase; } .brow2 em{ font-size:12px; color:var(--muted); }
.bchip{ display:inline-flex; align-items:center; gap:3px; padding:3px 7px 4px 5px; border:2px solid var(--ink); border-radius:10px; background:var(--panel2); font-size:17px; line-height:1.1; box-shadow:inset 0 -3px 0 var(--rc, transparent); }
.bchip b{ font:900 12px var(--body); } .bchip.m{ background:#ffe28a; color:var(--ink); }
.bstats{ display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:4px; }
.bst{ display:flex; justify-content:space-between; gap:4px; padding:3px 7px; border-radius:8px; background:var(--panel2); font-size:12px; } .bst small{ color:var(--muted); font-weight:800; } .bst b{ font-weight:900; }
.btn.play .cont{ display:block; font:800 13px var(--body); opacity:.9; }
.btn.play{ flex-direction:column; gap:0; }
.tiles .tile:last-child:nth-child(odd){ grid-column:span 2; }
.chb{ font-style:normal; color:var(--pink); font:800 13px var(--body); }
.nm{ display:flex; gap:6px; align-items:center; } .nm input{ width:150px; max-width:45vw; padding:7px 10px; border:2px solid var(--ink); border-radius:10px; font:800 14px var(--body); background:var(--panel2); color:var(--text); }
.lrow{ display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--panel); color:var(--text); border:3px solid var(--ink); border-radius:12px; }
.lrow.me{ background:#ffe28a; color:var(--ink); } .lrk{ font:400 20px var(--display); min-width:2ch; text-align:center; }

function rollRarity(luck, min){
  min = min || 0;
  const L = Math.max(0, luck) / 100;
  let total = 0; const ws = [];
  for (let i = 0; i < RAR.length; i++){ const w = i < min ? 0 : RAR[i].w * (1 + L * i * 1.2); ws.push(w); total += w; }
  let r = Math.random() * total;
  for (let i = 0; i < ws.length; i++){ r -= ws[i]; if (r <= 0) return i; }
  return RAR.length - 1;
}

}

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = a => a[(Math.random() * a.length) | 0];
const lerp = (a, b, t) => a + (b - a) * t;
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = (Math.random() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function rollCount(c){ const f = Math.floor(c + 1e-9); return f + (Math.random() < c - f ? 1 : 0); }
function compact(arr){ let j = 0; for (let i = 0; i < arr.length; i++){ const x = arr[i]; if (!x.dead) arr[j++] = x; } arr.length = j; }
function weightedPick(arr, wf){ let t = 0; for (const x of arr) t += wf(x); let r = Math.random() * t; for (const x of arr){ r -= wf(x); if (r <= 0) return x; } return arr[arr.length - 1]; }

/* ---------- spatial grid ---------- */
const GRID = {cs:80, cols:1, rows:1, cells:[[]]};
function gridInit(w, h){ GRID.cols = Math.ceil(w / GRID.cs) + 1; GRID.rows = Math.ceil(h / GRID.cs) + 1; GRID.cells = []; for (let i = 0; i < GRID.cols * GRID.rows; i++) GRID.cells.push([]); }
function gridBuild(list){
  const cells = GRID.cells; for (let i = 0; i < cells.length; i++) cells[i].length = 0;
  for (let i = 0; i < list.length; i++){ const e = list[i]; if (e.dead) continue;
    const cx = clamp((e.x / GRID.cs) | 0, 0, GRID.cols - 1), cy = clamp((e.y / GRID.cs) | 0, 0, GRID.rows - 1);
    cells[cy * GRID.cols + cx].push(e); }
}
function gridQuery(x, y, r, out){
  out.length = 0; const cs = GRID.cs;
  const x0 = clamp(((x - r) / cs) | 0, 0, GRID.cols - 1), x1 = clamp(((x + r) / cs) | 0, 0, GRID.cols - 1);
  const y0 = clamp(((y - r) / cs) | 0, 0, GRID.rows - 1), y1 = clamp(((y + r) / cs) | 0, 0, GRID.rows - 1);
  for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++){ const c = GRID.cells[cy * GRID.cols + cx]; for (let i = 0; i < c.length; i++) out.push(c[i]); }
  return out;
}
function enemiesInRange(x, y, R){ const out = []; const R2 = R * R; for (const e of G.enemies){ if (!e.dead && (e.x - x) * (e.x - x) + (e.y - y) * (e.y - y) < R2) out.push(e); } return out; }
function nearestEnemies(x, y, n, maxD){
  const res = []; const md2 = maxD * maxD;
  for (const e of G.enemies){
    if (e.dead) continue;
    const d2 = (e.x - x) * (e.x - x) + (e.y - y) * (e.y - y);
    if (d2 > md2) continue;
    if (res.length < n){ res.push([d2, e]); res.sort((a, b) => a[0] - b[0]); }
    else if (d2 < res[res.length - 1][0]){ res[res.length - 1] = [d2, e]; res.sort((a, b) => a[0] - b[0]); }
  }
  return res.map(r => r[1]);
}
function nearestExcluding(x, y, maxD, ex){
  let best = null, bd = maxD * maxD;
  for (const e of G.enemies){ if (e.dead || ex.indexOf(e.id) !== -1) continue; const d2 = (e.x - x) * (e.x - x) + (e.y - y) * (e.y - y); if (d2 < bd){ bd = d2; best = e; } }
  return best;
}

/* ---------- save + cloud mirror ---------- */
const SAVE_KEY = 'overstack-save-v1';
function defaultSave(){ return {silver:0, shop:{}, quests:{}, unlocked:{}, best:{}, heroWins:{}, totals:{kills:0, gold:0, runs:0, wins:0}, tier:1, settings:{sound:true, music:true, nums:true, shake:true, vibe:true, instantChest:true}, ts:0}; }
function normalizeSave(s){
  const d = defaultSave(); if (!s || typeof s !== 'object') return d;
  for (const k in d) if (s[k] === undefined || s[k] === null) s[k] = d[k];
  for (const k in d.settings) if (s.settings[k] === undefined) s.settings[k] = d.settings[k];
  for (const k in d.totals) if (s.totals[k] === undefined) s.totals[k] = d.totals[k];
  return s;
}
function loadSave(){ let s = null; try { s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) {} return normalizeSave(s); }
let SAVE = loadSave();
const CLOUD = {doc:null, timer:0};
function persist(){
  SAVE.ts = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {}
  try { if (typeof CG !== 'undefined' && CG.sdk) CG.sdk.data.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {}
  if (CLOUD.doc){ clearTimeout(CLOUD.timer); CLOUD.timer = setTimeout(() => { try { CLOUD.doc.set({json: JSON.stringify(SAVE)}).catch(() => {}); } catch (e) {} }, 800); }
}
async function cloudInit(onLoaded){
  try {
    if (!window.__noCloud || !window.__noCloud.use) return;
    const db = await window.__noCloud.use('db'); const user = await window.__noCloud.use('user');
    if (!db || !user) return;
    const id = await user.id(); if (!id) return; CLOUD.db = db; CLOUD.uid = id;
    const doc = db.doc('data/users/' + id + '/save');
    const snap = await doc.get();
    CLOUD.doc = doc;
    if (snap.exists){
      const d = snap.data(); let remote = null;
      try { remote = normalizeSave(JSON.parse(d.json)); } catch (e) {}
      if (remote && (remote.ts || 0) > (SAVE.ts || 0) && !G){ SAVE = remote; try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {} if (onLoaded) onLoaded(); return; }
    }
    persist();
  } catch (e) {}
}

function recalcStats(){
  const s = Object.assign({}, BASE);
  const add = (st, m) => { if (!st) return; if (m === undefined) m = 1; for (const k in st) s[k] = (s[k] || 0) + st[k] * m; };

  if (G.char.perLvl) add(G.char.perLvl, Math.min(G.level, 100));
  if (G.ovf) add(G.ovf);
  for (const sh of SHOP) if (sh.st) add(sh.st, Math.min(sh.max, SAVE.shop[sh.id] || 0));
  for (const t of G.tomes) add(t.tot);
  for (const id in G.items) add(ITEM[id].st, G.items[id]);
  add(G.buffs);
  const pr = {};
  const addP = (p, n) => { for (const k in p){ if (CHANCE_PROCS[k]) pr[k] = 1 - (1 - (pr[k] || 0)) * Math.pow(1 - p[k], n); else pr[k] = (pr[k] || 0) + p[k] * n; } };
  if (G.char.proc) addP(G.char.proc, 1);
  for (const id in G.items) if (ITEM[id].proc) addP(ITEM[id].proc, G.items[id]);
  s.moveSpeed = clamp(s.moveSpeed, 0.4, 2.6); s.attackSpeed = clamp(s.attackSpeed, 0.25, 6); s.projSpeed = clamp(s.projSpeed, 0.4, 3); s.duration = clamp(s.duration, 0.4, 4);
  s.area = clamp(s.area, 0.4, 4); s.damage = Math.max(0.2, s.damage); s.critChance = Math.max(0, s.critChance);
  s.armor = Math.max(0, s.armor); s.evasion = Math.max(0, s.evasion); s.chestDisc = clamp(s.chestDisc, 0, 0.6);
  s.difficulty = Math.max(0.5, s.difficulty); s.pickup = Math.max(0.3, s.pickup);
  s.hpMax = Math.max(10, Math.round(s.maxHp * (1 + Math.max(-0.5, s.maxHpPct))));
  if (chOn('glass')) s.hpMax = Math.max(10, Math.round(s.hpMax * 0.5));

  p.hp = Math.min(p.hp, s.hpMax);

  p.shield = Math.min(p.shield, s.shield);

}

}

const QP = [];
function updateProjectiles(dt){
  const P = G.player;
  for (const pr of G.projs){
    if (pr.dead) continue;
    pr.t += dt;
    if (pr.kind === 'boomer'){
      pr.rot += dt * 14;
      if (pr.phase === 0){ const f = Math.max(0, 1 - pr.t / pr.tOut); pr.x += pr.vx * f * dt; pr.y += pr.vy * f * dt; if (pr.t >= pr.tOut){ pr.phase = 1; pr.hits.length = 0; if (pr.w.mastered) for (let k = 0; k < 8; k++) shoot(pr.w, wsOf(pr.w), 'shard', pr.x, pr.y, k / 8 * TAU + pr.rot, 400, {r:7, life:0.6, pierce:2, dmg:pr.dmg * 0.8}); } }

    } else if (pr.kind === 'wisp'){
      pr.rt -= dt;
      if (!pr.tgt || pr.tgt.dead || pr.rt <= 0){ pr.rt = 0.25; const pt = pr.seek ? priorityTarget(pr.x, pr.y, 450) : null; pr.tgt = (pt && pr.hits.indexOf(pt.id) === -1) ? pt : nearestExcluding(pr.x, pr.y, 450, pr.hits); }

      pr.x += pr.vx * dt; pr.y += pr.vy * dt;
    } else { pr.x += pr.vx * dt; pr.y += pr.vy * dt; }
    if (pr.w.level >= 15 && Math.random() < 0.12) particle(pr.x, pr.y, rand(-30, 30), rand(-30, 30), 0.35, '#ff9df0', 2.5);
    pr.life -= dt;
    if (pr.dead || pr.life <= 0 || pr.x < -50 || pr.y < -50 || pr.x > G.W + 50 || pr.y > G.H + 50){ if (!pr.dead) projEnd(pr); pr.dead = true; continue; }
    gridQuery(pr.x, pr.y, pr.r + 30, QP);

      if (pr.kind === 'bolt' && pr.w.mastered){ const t = nearestExcluding(e.x, e.y, 150, [e.id]); if (t){ fxBolt(e.x, e.y, t.x, t.y, '#fff27a', 2); hitEnemy(t, pr.dmg * 0.5, {crit:pr.crit, proc:false, src:'bolt'}); } }

/* ---------- hits, kills ---------- */
function hitEnemy(e, dmg, o){
  if (e.dead || e.inv > G.time) return 0;
  let d = dmg; const pr = G.proc;

  if (e.elite || e.boss) d *= G.stats.eliteDmg;

  if (e.boss && o.src === 'boom') d *= 0.05;
  let ct = 0; const cc = o.crit || 0;
  if (cc > 0){ ct = Math.floor(cc); if (Math.random() < cc - ct) ct++; }
  if (ct > 0) d *= Math.pow(1 + G.stats.critDamage, ct);
  let big = false;
  if (o.proc !== false && pr.bonk && Math.random() < pr.bonk){ d *= 12; big = true; shake(4); sfx('bonk'); }
  const src = o.src || 'other'; G.rs.by[src] = (G.rs.by[src] || 0) + Math.min(d, Math.max(0, e.hp));
  e.hp -= d; e.flash = 0.1; G.rs.dmg += d;
  if (d > G.rs.maxHit){ G.rs.maxHit = d; if (d >= 1000) questEvent('hit', d); }
  if (SAVE.settings.nums) dmgNum(e.x + rand(-6, 6), e.y - e.r, d, big ? 3 : ct);
  if ((o.kbx || o.kby) && !(e.frozenT > G.time)){ const res = (e.boss ? 0.04 : e.elite ? 0.35 : 1) * (1 - (e.res || 0)); e.kbx += o.kbx * res; e.kby += o.kby * res; }
  if (o.proc !== false){
    if (pr.burn && Math.random() < pr.burn){ e.burnT = 3; e.burnDps = Math.max(e.burnDps, d * 0.6 / 3); }
    if (pr.cracker && Math.random() < pr.cracker) explode(e.x, e.y, 50 * Math.sqrt(G.stats.area), d * 0.6, 0, 0.5, 'cracker', false, true);
    if (pr.chill && Math.random() < pr.chill){ e.slowT = Math.max(e.slowT, 2); e.slowAmt = e.boss ? 0.2 : 0.45; }
    if (pr.zap && Math.random() < pr.zap){ const t = nearestExcluding(e.x, e.y, 170, [e.id]); if (t){ fxBolt(e.x, e.y, t.x, t.y, '#fff27a', 2); hitEnemy(t, dmg * 1.5, {crit:o.crit, proc:false, src:'zap'}); } }
    if (pr.chain && Math.random() < pr.chain){ let cx = e.x, cy = e.y; const ex = [e.id];
      for (let k = 0; k < 2; k++){ const t = nearestExcluding(cx, cy, 160, ex); if (!t) break; ex.push(t.id); fxBolt(cx, cy, t.x, t.y, '#c58bff', 2); hitEnemy(t, dmg * 0.6, {crit:o.crit, proc:false, src:'chain'}); cx = t.x; cy = t.y; } }
  }
  if (pr.leech && G.leechB > 0){ const h = Math.min(d * pr.leech, G.leechB); G.leechB -= h; heal(h); }
  if (e.hp <= 0) killEnemy(e, o.src);
  return d;
}

  if (src === 'aura'){ G.rs.auraKills++; if (G.rs.auraKills % 10 === 0) questEvent('auraKills', G.rs.auraKills); }

/* ---------- level-up choices ---------- */

      const isInt = !!WUP[key].int || (def.inc && def.inc[key] !== undefined);
      return {key, v:isInt ? Math.max(1, Math.round(inc * R.mult)) : inc * R.mult * dk, int:isInt};
    });

      if (!G.bossSummoned){ const a = rand(0, TAU); summonBoss(clamp(G.player.x + Math.cos(a) * 380, 80, G.W - 80), clamp(G.player.y + Math.sin(a) * 380, 80, G.H - 80)); }

  const base = st.kills * 0.05 + G.level * 0.9 + (G.loop * 3 + G.stageIdx) * 22 + st.bosses * 18 + (won ? 60 : 0) + st.chests * 1.5;
  st.silver = Math.max(1, Math.round(base * TIERS[G.tier].silver * (1 + Math.max(0, G.stats.difficulty - 1) * 0.5)));

/* ===================== LOOP ===================== */
let lastT = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, Math.max(0, (now - (lastT || now)) / 1000)); lastT = now;
  padTick();
  const live = G && !G.over && !G.modal && !G.paused;
  if (live){
    try { readInput(); step(dt * (SAVE.settings.speed ?? 1) * (G.devSpeed || 1));
      if (!G.modal && !G.over && G.pendingLevels > 0) openLevelUp();
      FROZEN = 0; render(); qualityTick(now - prevT);
      if (G && G.frame % 180 === 0) snapRun();
    } catch (err){ noteError(String((err && err.stack) || err).split('\n').slice(0, 2).join(' | ')); try { snapRun(); } catch (e2) {}
      if (G){ G.paused = true; releaseJoy(); showUI('<div class="modal"><h2 class="mtitle">Oops!</h2><p class="msub">The game hit an error. Your run was saved, so you can continue it from the title screen.</p><button class="btn big pink" data-a="menu">Back to title</button></div>', 'modal'); } }
  } else if (!G){ render(); }
  else if (FROZEN < 2){ FROZEN++; render(); }
  cgPlay(!!live && !document.hidden);
  prevT = now;
}
let prevT = 0;
function boot(){
  resize();
  applySettings();
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  if (/[?&]cover/.test(location.search)) showUI('<div class="cover"><div class="logo"><span>OVER</span><span>STACK</span></div><p class="tagline">Stack modifiers until the screen melts</p></div>');
  else showTitle();
  requestAnimationFrame(frame);
  cgInit();
  try {
    const plug = window.Capacitor && window.Capacitor.Plugins;
    if (plug && plug.StatusBar){ plug.StatusBar.setOverlaysWebView({overlay:true}).catch(() => {}); plug.StatusBar.hide().catch(() => {}); }
    if (plug && plug.App) plug.App.addListener('backButton', () => {
      if (!UI.hidden){ const back = UI.querySelector('.bar button[data-a], [data-a=resume], [data-a=microLeave], [data-a=leave], [data-a=giveUp]');
        if (back) back.click(); else if (!G && MENU.screen === 'title') plug.App.exitApp(); }
      else if (G && !G.over) openPause();
    });
  } catch (e) {}
  if (HAS_MANIFEST && 'serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  cloudInit(() => { if (!G && MENU.screen === 'title') showTitle(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const k in EMO) delete EMO[k]; for (const k in ATLAS) delete ATLAS[k]; FROZEN = 0; });
}
boot();

}
function devRunTools(){
  return `<div class="devgrid">${devBtn('god', (G.god ? '✅ ' : '') + 'God mode')}${devBtn('fast', (G.devSpeed === 3 ? '✅ ' : '') + 'Fast forward 3×')}${devBtn('heal', 'Full heal')}${devBtn('lv10', '+10 levels')}${devBtn('gold', '+1,000 gold')}${devBtn('maxGear', 'Max all gear')}${devBtn('items', 'Every item')}${devBtn('weapons', 'Fill weapon slots')}${devBtn('boss', 'Spawn boss')}${devBtn('kill', 'Kill all enemies')}${devBtn('next', 'Next stage')}${devBtn('swarm', 'Jump to Final Swarm')}</div><p class="note">This run won't post to the leaderboard once you use a tool.</p>`;
}
function devAction(v){
  if (!SAVE.settings.dev) return;
  if (!G || G.over){
    if (v === 'silver'){ SAVE.silver += 10000; toast('+10,000 silver', '', 'gold'); }
    else if (v === 'unlockAll'){ for (const c of CHARS) SAVE.unlocked['char:' + c.id] = true; for (const id in WEAPONS) SAVE.unlocked['weapon:' + id] = true; for (const t of TOMES) SAVE.unlocked['tome:' + t.id] = true; for (const it of ITEMS) SAVE.unlocked['item:' + it.id] = true; SAVE.tier = 3; toast('Everything unlocked', 'All heroes, weapons, tomes, items and tiers', 'good'); }
    else if (v === 'maxShop'){ for (const sh of SHOP) SAVE.shop[sh.id] = sh.max; toast('Upgrades maxed', '', 'good'); }
    else if (v === 'quests'){ for (const q of QUESTS) if (!SAVE.quests[q.id]) completeQuest(q); }
    else if (v === 'devOff'){ SAVE.settings.dev = false; toast('Dev mode off', '', ''); }
    persist(); rerenderSettings(); return;
  }
  G.devUsed = true; const P = G.player;
  if (v === 'god') G.god = !G.god;
  else if (v === 'fast') G.devSpeed = G.devSpeed === 3 ? 1 : 3;
  else if (v === 'heal') P.hp = G.stats.hpMax;
  else if (v === 'lv10'){ const target = G.level + 10; while (G.level < target) addXp((G.xpNext - G.xp) / G.stats.xpGain + 1); }
  else if (v === 'gold') G.gold += 1000;
  else if (v === 'maxGear'){ for (const w of G.weapons){ w.level = W_MAX; w.up.dmg += 3; w.up.cd += 1; w.up.area += 0.5; if (!w.mastered) masterWeapon(w); } for (const t of G.tomes) if (t.def.st){ t.level = T_MAX; t.tot = stMul(t.def.st, 20); } recalcStats(); }
  else if (v === 'items'){ for (const it of ITEMS) addItem(it.id); }
  else if (v === 'weapons'){ const av = shuffle(Object.values(WEAPONS).filter(d => !G.weapons.some(w => w.id === d.id))); while (G.weapons.length < G.wSlots && av.length) G.weapons.push(makeWeapon(av.pop().id)); }
  else if (v === 'boss'){ if (!G.bossSummoned) summonBoss(P.x + 220, P.y); else toast('Boss already summoned', '', ''); }
  else if (v === 'kill'){ for (const e of G.enemies) if (!e.dead && !e.boss) killEnemy(e, 'dev'); compact(G.enemies); }
  else if (v === 'next'){ nextStage(); }
  else if (v === 'swarm'){ G.stageTime = Math.max(G.stageTime, stageLen() - 1); }
  renderPause('dev');
}

</script>
